name: Java CI with Maven and Headless Tests

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout code
    - uses: actions/checkout@v4

    # Step 2: Set up JDK 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    # Step 3: Build the project (optional: javafx:run if you want to test build)
    - name: Build project
      run: mvn clean javafx:run -B

    # Step 4: Run headless unit tests
    - name: Run unit tests
      run: mvn clean test -B

    # Optional: Uploads the full dependency graph for Dependabot alerts
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
